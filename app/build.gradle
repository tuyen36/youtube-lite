plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.youtubelite"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.youtubelite"
        // May phu cu: ho tro tu Android 5.0 (Lollipop, API 21)
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Chi build cho chip 32-bit (armeabi-v7a): may cu da so chip nay,
        // APK nhe hon ~40% so voi build du abi.
        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ExoPlayer (Media3) 1.4.1 - ban cuoi con ho tro minSdk 21 on dinh.
    def media3Version = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"

    // NewPipeExtractor - lay link stream YouTube khong can API key.
    implementation "com.github.TeamNewPipe:NewPipeExtractor:v0.24.5"

    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.github.bumptech.glide:glide:4.16.0"
}
