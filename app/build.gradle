plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.youtubelite"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.youtubelite"
        // May phu cu: ho tro tu Android 5.0 (Lollipop, API 21)
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.5"

        // Asus FonePad 8 K016 dùng chip Intel Atom Z3560 (x86), không phải ARM:
        // phải build cả x86 lẫn armeabi-v7a thì máy Intel mới mở được app.
        // (Bản cũ chỉ có armeabi-v7a nên cài xong bấm vào là văng ngay.)
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        // K016 chạy Android 5.0 (API 21): phải giữ Java 8 + desugar thì máy cũ mới mở được.
        // (Bản cũ để Java 17 không desugar nên cài xong bấm vào là văng ngay.)
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    // ExoPlayer (Media3) 1.4.1 - ban cuoi con ho tro minSdk 21 on dinh.
    def media3Version = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"

    // NewPipeExtractor FORK tuyen36 — từ v0.26.5, sửa API Android 6+ về API 21
    // (URLDecoder.decode(String,Charset) -> decode(String,String)) để K016 hết văng.
    // JitPack build thẳng từ nhánh dev của fork.
    implementation "com.github.tuyen36:NewPipeExtractor:dev-SNAPSHOT"

    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    // Desugar 1.2.3: dòng 1.x, không có Record nên D8/AGP 8.5.2 build được.
    // 2.x chứa Record backport, D8 kèm AGP 8.5.2 không tạo được global synthetic -> fail mergeExtDex.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.2.3"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.github.bumptech.glide:glide:4.16.0"
}
